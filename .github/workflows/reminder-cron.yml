name: Trigger Telegram Reminders Cron

on:
  schedule:
    # Запуск каждые 30 минут для точного срабатывания расписаний
    - cron: '7,37 * * * *'
  workflow_dispatch: # Возможность ручного запуска через вкладку Actions в GitHub

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TMA Reminders Endpoint
        run: |
          curl --fail-with-body --show-error --location \
            -X POST \
            -H "X-Internal-Cron-Token: ${{ secrets.REMINDER_CRON_TOKEN }}" \
            https://tma-amber.vercel.app/api/bot/cron-reminders
